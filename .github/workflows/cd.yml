name: CD - build documents

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build SRS, SAD and Test Plan (.docx)
        run: bash scripts/build_docs.sh build

      - name: Upload documents
        uses: actions/upload-artifact@v4
        with:
          name: team13-documents
          path: build/*.docx
          retention-days: 30
